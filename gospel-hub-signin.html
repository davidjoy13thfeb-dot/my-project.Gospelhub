<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gospel Hub - Sign In</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* ================= LEFT SIDE ================= */

    .left-side {
      width: 45%;
      min-height: 100vh;
      position: relative;
      background: url('https://images.unsplash.com/photo-1504052434569-70ad5836ab65?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 50px;
      overflow: hidden;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.9),
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.2)
      );
    }

    .content {
      position: relative;
      z-index: 2;
      color: white;
      width: 100%;
    }

    .logo {
      position: absolute;
      top: 40px;
      left: 50px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      color: white;
      z-index: 2;
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-text h1 {
      font-size: 48px;
      line-height: 1.1;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .hero-text p {
      font-size: 16px;
      line-height: 1.6;
      color: #ddd;
    }

    /* ================= RIGHT SIDE ================= */

    .right-side {
      width: 55%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
    }

    .login-box h1 {
      font-size: 38px;
      margin-bottom: 10px;
      color: #111;
    }

    .top-text {
      margin-bottom: 25px;
      color: #666;
    }

    .top-text a {
      color: #e53935;
      text-decoration: none;
      font-weight: bold;
    }

    /* ================= SOCIAL BUTTONS ================= */

    .social-btn {
      width: 100%;
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 30px;
      border: 1px solid #dadce0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #3c4043;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    .social-btn:active {
      transform: scale(0.98);
    }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .social-btn.apple {
      background: #faf8f8;
      color: #000;
    }

    .social-btn.facebook {
      background: #1877f2;
      color: white;
      border-color: #1877f2;
    }

    /* ================= OR DIVIDER ================= */

    .or {
      text-align: center;
      margin: 25px 0;
      color: #888;
      position: relative;
    }

    .or::before,
    .or::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }

    .or::before { left: 0; }
    .or::after  { right: 0; }

    /* ================= INPUTS ================= */

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      height: 55px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #e53935;
    }

    /* ================= REMEMBER ME ================= */

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #e53935;
      cursor: pointer;
    }

    .remember-row label {
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }

    /* ================= SIGN IN BUTTON ================= */

    .signin-btn {
      width: 100%;
      height: 55px;
      background: #e53935;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .signin-btn:hover {
      background: #c62828;
    }

    /* ================= BOTTOM LINKS ================= */

    .bottom-links {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .bottom-links a {
      text-decoration: none;
      color: #555;
    }

    .bottom-links a:hover {
      color: #e53935;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      .left-side,
      .right-side {
        width: 100%;
      }

      .hero-text h1 {
        font-size: 32px;
      }

      .left-side {
        padding: 30px;
        min-height: 300px;
      }

      .logo {
        top: 30px;
        left: 30px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left-side">

    <div class="overlay"></div>

    <div class="logo">Gospel Hub</div>

    <div class="content">
      <div class="hero-text">
        <h1>Strengthen Your Walk With God Every Day.</h1>
        <p>
          <strong>
          Scripture. Devotionals. Worship. Sermons. Prayer. Community. Everything you need to grow in faith, every single day.
          </strong>
        </p>
      </div>
    </div>

  </div>

  <!-- RIGHT SIDE -->
  <div class="right-side">

    <div class="login-box">

      <h1>Sign In</h1>

      <!-- ✅ FIX: removed stray "s", linked to correct filename -->
      <p class="top-text">
        Don't have an account?
        <a href="gospel-hub-create-account.html">Create Account</a>
      </p>

      <!-- SOCIAL LOGIN BUTTONS -->

      <button type="button" class="social-btn google">
        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <button type="button" class="social-btn apple">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701z"/>
        </svg>
        Sign in with Apple
      </button>

      <button type="button" class="social-btn facebook">
        <svg class="icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        Sign in with Facebook
      </button>

      <div class="or">OR</div>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="signin-btn">Sign In</button>

      </form>

      <div class="bottom-links">
        <a href="#">Forgot Password?</a>
        <a href="#">Need Help?</a>
      </div>

      <footer>
        Gospel Hub &copy; 2026
      </footer>

    </div>

  </div>

</div>

<script>
  const form = document.getElementById("loginForm");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
      alert("Please fill in all fields.");
      return;
    }

    alert("Login Successful!");
  });
</script>

</body>
</html>
