<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Holy Bible Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500;600&family=Cinzel+Decorative:wght@400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf7ee;--bg2:#f4ebda;--bg3:#ede0cc;--bg4:#e4d3b8;
  --ink:#1e120a;--ink2:#4a2e1c;--ink3:#7a5c42;--ink4:#a88060;
  --red:#7a1515;--gold:#8a6914;--gold2:#b8921a;
  --border:#c9b090;--border2:#dcc9a8;
  --hl-y:rgba(253,216,53,0.38);--hl-b:rgba(66,165,245,0.3);
  --hl-g:rgba(102,187,106,0.35);--hl-p:rgba(186,104,200,0.3);--hl-r:rgba(239,83,80,0.28);
  --fs:16px;--lh:1.9;
}
html,body{height:100%;overflow:hidden}
body{font-family:'EB Garamond',Georgia,serif;background:var(--bg);color:var(--ink)}
#shell{display:flex;height:100vh;position:relative}

#sb{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s}
#sb-logo{padding:14px 16px 12px;border-bottom:1px solid var(--border);background:var(--bg3)}
#sb-logo .title{font-family:'Cinzel Decorative',serif;font-size:13px;color:var(--red);letter-spacing:.02em;line-height:1.3}
#sb-logo .sub{font-size:11px;color:var(--ink4);margin-top:2px;font-style:italic}
#sb-search{padding:9px 10px;border-bottom:1px solid var(--border);position:relative}
#sb-search input{width:100%;padding:6px 8px 6px 28px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;font-family:'EB Garamond',serif;font-size:13px;color:var(--ink);outline:none}
#sb-search .si{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink4);pointer-events:none}
#tb-row{display:flex;border-bottom:1px solid var(--border)}
.tb{flex:1;padding:7px 4px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.04em;cursor:pointer;text-align:center;background:var(--bg3);color:var(--ink3);border:none;transition:background .12s}
.tb.on{background:var(--bg);color:var(--red)}
#bk-list{flex:1;overflow-y:auto;padding:4px 0}
#bk-list::-webkit-scrollbar{width:3px}
#bk-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.bk{padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;transition:background .1s;border-left:3px solid transparent}
.bk:hover{background:var(--bg3);color:var(--ink)}
.bk.on{background:var(--bg3);color:var(--red);border-left-color:var(--red)}
.bk-ch{font-size:10px;color:var(--ink4);font-style:italic}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden}
#tb-title{font-family:'Cinzel',serif;font-size:14px;color:var(--red);white-space:nowrap;flex-shrink:0}
#tb-chap,#tb-trans{padding:4px 8px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;font-family:'Cinzel',serif;font-size:12px;color:var(--ink);cursor:pointer}
#tb-chap{max-width:110px}
.spacer{flex:1}
.ic-btn{padding:5px 8px;background:transparent;border:1px solid var(--border2);border-radius:5px;font-size:13px;cursor:pointer;color:var(--ink2);transition:all .12s;display:flex;align-items:center;gap:4px;white-space:nowrap;font-family:'Cinzel',serif}
.ic-btn:hover{background:var(--bg3);border-color:var(--border)}
.ic-btn.on{background:var(--red);color:#fff;border-color:var(--red)}
.nav-b{padding:5px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;font-family:'Cinzel',serif;font-size:11px;color:var(--ink2);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:3px}
.nav-b:hover:not(:disabled){background:var(--gold2);color:#fff;border-color:var(--gold2)}
.nav-b:disabled{opacity:.35;cursor:default}

#tb2{background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hl-dot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .12s,border-color .12s;flex-shrink:0}
.hl-dot:hover{transform:scale(1.25)}
.hl-dot.sel{border-color:var(--ink)}
#fs-label{font-size:11px;color:var(--ink3);margin-left:4px;font-style:italic}
.fs-btn{padding:3px 7px;background:var(--bg);border:1px solid var(--border2);border-radius:4px;font-size:12px;cursor:pointer;color:var(--ink2);font-family:'Cinzel',serif}
.fs-btn:hover{background:var(--bg3)}

#sr-panel{background:var(--bg2);border-bottom:1px solid var(--border);max-height:200px;overflow-y:auto;display:none}
#sr-panel.vis{display:block}
#sr-inner{padding:8px 14px}
.sr-hd{font-size:11px;color:var(--ink4);font-style:italic;margin-bottom:6px}
.sr-row{padding:7px 10px;border-radius:5px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
.sr-row:hover{background:var(--bg3);border-color:var(--border2)}
.sr-ref{font-family:'Cinzel',serif;font-size:10px;color:var(--red);margin-bottom:2px;letter-spacing:.04em}
.sr-txt{font-size:12.5px;color:var(--ink2);line-height:1.45}
.sr-txt em{font-style:normal;background:var(--hl-y);padding:0 2px;border-radius:2px}

#reader{flex:1;overflow-y:auto;padding:28px 52px 40px;background:var(--bg)}
#reader::-webkit-scrollbar{width:4px}
#reader::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#ch-title{font-family:'Cinzel',serif;font-size:20px;color:var(--red);text-align:center;margin-bottom:4px;letter-spacing:.04em}
#ch-sub{font-size:12px;color:var(--ink4);text-align:center;font-style:italic;letter-spacing:.1em;margin-bottom:6px}
#progress-bar{height:2px;background:var(--border2);margin-bottom:24px;border-radius:1px;overflow:hidden}
#progress-fill{height:100%;background:var(--gold2);border-radius:1px;transition:width .3s}

.v-row{display:flex;gap:10px;padding:2px 0 2px 2px;border-radius:4px;border-left:3px solid transparent;transition:background .1s,border-color .1s;position:relative;cursor:default}
.v-row:hover{background:rgba(0,0,0,.03)}
.v-row:hover .v-acts{opacity:1;pointer-events:all}
.v-row.bm{border-left-color:var(--gold2)}
.v-num{font-family:'Cinzel',serif;font-size:10px;color:var(--gold2);min-width:20px;padding-top:4px;text-align:right;flex-shrink:0;user-select:none}
.v-txt{font-size:var(--fs);line-height:var(--lh);color:var(--ink);flex:1;transition:font-size .15s}
.v-row.hl-y .v-txt{background:var(--hl-y);border-radius:2px;padding:0 3px}
.v-row.hl-b .v-txt{background:var(--hl-b);border-radius:2px;padding:0 3px}
.v-row.hl-g .v-txt{background:var(--hl-g);border-radius:2px;padding:0 3px}
.v-row.hl-p .v-txt{background:var(--hl-p);border-radius:2px;padding:0 3px}
.v-row.hl-r .v-txt{background:var(--hl-r);border-radius:2px;padding:0 3px}
.v-acts{opacity:0;pointer-events:none;position:absolute;right:0;top:-1px;display:flex;gap:3px;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:3px 6px;z-index:5;transition:opacity .12s}
.va{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px;color:var(--ink2);transition:background .1s}
.va:hover{background:var(--bg3)}

.panel{position:fixed;right:0;top:0;height:100%;width:270px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);transition:transform .25s;z-index:30}
.panel.open{transform:translateX(0)}
.pn-hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg3);flex-shrink:0}
.pn-hd h3{font-family:'Cinzel',serif;font-size:13px;color:var(--red);display:flex;align-items:center;gap:6px}
.pn-close{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:16px}
.pn-body{flex:1;overflow-y:auto;padding:10px}
.pn-body::-webkit-scrollbar{width:3px}
.pn-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.bm-card{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:all .12s;border-left:3px solid var(--gold2)}
.bm-card:hover{background:var(--bg3)}
.bm-ref{font-family:'Cinzel',serif;font-size:10px;color:var(--red);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.bm-del{background:none;border:none;cursor:pointer;color:var(--ink4);font-size:12px}
.bm-preview{font-size:12px;color:var(--ink2);line-height:1.45}

.plan-day{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:all .12s;display:flex;align-items:flex-start;gap:8px}
.plan-day:hover{background:var(--bg3)}
.plan-day.done{opacity:.55}
.day-check{width:18px;height:18px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.plan-day.done .day-check{background:var(--gold2);border-color:var(--gold2);color:#fff}
.day-label{font-family:'Cinzel',serif;font-size:10px;color:var(--ink3);margin-bottom:2px}
.day-ref{font-size:13px;color:var(--ink)}

#notes-ta{width:100%;height:160px;padding:8px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;font-family:'EB Garamond',serif;font-size:13px;color:var(--ink);resize:none;line-height:1.6;outline:none}
.note-entry{background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:8px 10px;margin-bottom:6px;border-left:3px solid var(--red)}
.note-ref{font-family:'Cinzel',serif;font-size:10px;color:var(--red);margin-bottom:3px}
.note-txt{font-size:12px;color:var(--ink2);line-height:1.5}

#votd{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 52px;display:flex;align-items:baseline;gap:10px}
#votd-ref{font-family:'Cinzel',serif;font-size:10px;color:var(--gold2);letter-spacing:.06em;white-space:nowrap;flex-shrink:0}
#votd-text{font-size:13px;color:var(--ink2);font-style:italic;line-height:1.5}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#f5ede0;font-family:'Cinzel',serif;font-size:12px;padding:7px 18px;border-radius:20px;opacity:0;transition:all .25s;pointer-events:none;z-index:100;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#menu-btn{display:none;background:none;border:none;cursor:pointer;font-size:22px;color:var(--ink2);padding:4px;align-items:center}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}

@media(max-width:700px){
  #sb{position:fixed;left:0;top:0;height:100%;z-index:25;transform:translateX(-100%)}
  #sb.open{transform:translateX(0)}
  #menu-btn{display:flex}
  #sb-overlay.vis{display:block}
  #reader{padding:20px 16px 32px}
  #votd{padding:8px 16px}
}
</style>
</head>
<body>
<div id="shell">
  <div id="sb-overlay"></div>

  <div id="sb">
    <div id="sb-logo">
      <div class="title">✦ Holy Bible</div>
      <div class="sub">Sacred Scriptures</div>
    </div>
    <div id="sb-search">
      <i class="ti ti-search si" aria-hidden="true"></i>
      <input id="q" placeholder="Search scripture…" autocomplete="off" spellcheck="false"/>
    </div>
    <div id="tb-row">
      <button class="tb on" data-t="OT">Old Testament</button>
      <button class="tb" data-t="NT">New Testament</button>
    </div>
    <div id="bk-list"></div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="menu-btn" aria-label="Open menu"><i class="ti ti-menu-2"></i></button>
      <span id="tb-title">Genesis 1</span>
      <select id="tb-chap" aria-label="Chapter"></select>
      <select id="tb-trans" aria-label="Translation" title="Translation">
        <option value="kjv">KJV</option>
        <option value="web">WEB</option>
        <option value="clementine">Clementine</option>
        <option value="almeida">Almeida (PT)</option>
        <option value="rccv">RCCV</option>
      </select>
      <div class="spacer"></div>
      <button class="nav-b" id="bn-prev"><i class="ti ti-arrow-left" style="font-size:12px"></i> Prev</button>
      <button class="nav-b" id="bn-next">Next <i class="ti ti-arrow-right" style="font-size:12px"></i></button>
      <button class="ic-btn" id="btn-bm-panel" title="Bookmarks"><i class="ti ti-bookmark" style="font-size:14px"></i></button>
      <button class="ic-btn" id="btn-plan" title="Reading Plan"><i class="ti ti-calendar" style="font-size:14px"></i></button>
      <button class="ic-btn" id="btn-notes" title="Notes"><i class="ti ti-pencil" style="font-size:14px"></i></button>
    </div>

    <div id="tb2">
      <span style="font-size:11px;color:var(--ink4);font-family:'Cinzel',serif;letter-spacing:.04em">Highlight:</span>
      <div class="hl-dot sel" style="background:var(--hl-y)" data-c="hl-y" title="Yellow"></div>
      <div class="hl-dot" style="background:var(--hl-b)" data-c="hl-b" title="Blue"></div>
      <div class="hl-dot" style="background:var(--hl-g)" data-c="hl-g" title="Green"></div>
      <div class="hl-dot" style="background:var(--hl-p)" data-c="hl-p" title="Purple"></div>
      <div class="hl-dot" style="background:var(--hl-r)" data-c="hl-r" title="Red"></div>
      <div class="hl-dot" style="background:#ede0cc;border:1px solid var(--border)" data-c="clear" title="Clear highlight"></div>
      <div style="width:1px;background:var(--border);height:16px;margin:0 4px"></div>
      <span id="fs-label">Aa 16px</span>
      <button class="fs-btn" id="fs-dn">A−</button>
      <button class="fs-btn" id="fs-up">A+</button>
      <div class="spacer"></div>
      <button class="ic-btn" id="btn-share"><i class="ti ti-share" style="font-size:13px"></i> Share</button>
    </div>

    <div id="sr-panel"><div id="sr-inner"></div></div>
    <div id="votd"><span id="votd-ref"></span><span id="votd-text"></span></div>

    <div id="reader">
      <div id="ch-title">Genesis 1</div>
      <div id="ch-sub">King James Version</div>
      <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
      <div id="vv"></div>
    </div>
  </div>

  <div class="panel" id="pn-bm">
    <div class="pn-hd"><h3><i class="ti ti-bookmark" style="font-size:13px"></i>Bookmarks</h3><button type="button" class="pn-close" data-close="pn-bm" aria-label="Close Bookmarks"><i class="ti ti-x"></i></button></div>
    <div class="pn-body" id="bm-body"></div>
  </div>

  <div class="panel" id="pn-plan">
    <div class="pn-hd"><h3><i class="ti ti-calendar" style="font-size:13px"></i>30-Day Reading Plan</h3><button type="button" class="pn-close" data-close="pn-plan" aria-label="Close Reading Plan"><i class="ti ti-x"></i></button></div>
    <div class="pn-body" id="plan-body"></div>
  </div>

  <div class="panel" id="pn-notes">
    <div class="pn-hd"><h3><i class="ti ti-pencil" style="font-size:13px"></i>Notes</h3><button type="button" class="pn-close" data-close="pn-notes" aria-label="Close Notes"><i class="ti ti-x"></i></button></div>
    <div class="pn-body">
      <div style="margin-bottom:8px;font-size:11px;color:var(--ink4);font-style:italic" id="notes-ctx">Note for current chapter</div>
      <textarea id="notes-ta" placeholder="Write your reflections here…"></textarea>
      <button class="ic-btn" style="width:100%;justify-content:center;margin-top:6px" id="save-note"><i class="ti ti-device-floppy" style="font-size:13px"></i> Save note</button>
      <div style="margin-top:12px;border-top:1px solid var(--border2);padding-top:10px">
        <div style="font-family:'Cinzel',serif;font-size:10px;color:var(--ink3);margin-bottom:8px;letter-spacing:.04em">Saved Notes</div>
        <div id="notes-list"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const BOOKS={
  OT:[
    {n:"Genesis",a:"Gen",c:50},{n:"Exodus",a:"Exo",c:40},{n:"Leviticus",a:"Lev",c:27},
    {n:"Numbers",a:"Num",c:36},{n:"Deuteronomy",a:"Deu",c:34},{n:"Joshua",a:"Jos",c:24},
    {n:"Judges",a:"Jdg",c:21},{n:"Ruth",a:"Rut",c:4},{n:"1 Samuel",a:"1Sa",c:31},
    {n:"2 Samuel",a:"2Sa",c:24},{n:"1 Kings",a:"1Ki",c:22},{n:"2 Kings",a:"2Ki",c:25},
    {n:"1 Chronicles",a:"1Ch",c:29},{n:"2 Chronicles",a:"2Ch",c:36},{n:"Ezra",a:"Ezr",c:10},
    {n:"Nehemiah",a:"Neh",c:13},{n:"Esther",a:"Est",c:10},{n:"Job",a:"Job",c:42},
    {n:"Psalms",a:"Psa",c:150},{n:"Proverbs",a:"Pro",c:31},{n:"Ecclesiastes",a:"Ecc",c:12},
    {n:"Song of Solomon",a:"Sng",c:8},{n:"Isaiah",a:"Isa",c:66},{n:"Jeremiah",a:"Jer",c:52},
    {n:"Lamentations",a:"Lam",c:5},{n:"Ezekiel",a:"Eze",c:48},{n:"Daniel",a:"Dan",c:12},
    {n:"Hosea",a:"Hos",c:14},{n:"Joel",a:"Joe",c:3},{n:"Amos",a:"Amo",c:9},
    {n:"Obadiah",a:"Oba",c:1},{n:"Jonah",a:"Jon",c:4},{n:"Micah",a:"Mic",c:7},
    {n:"Nahum",a:"Nah",c:3},{n:"Habakkuk",a:"Hab",c:3},{n:"Zephaniah",a:"Zep",c:3},
    {n:"Haggai",a:"Hag",c:2},{n:"Zechariah",a:"Zec",c:14},{n:"Malachi",a:"Mal",c:4}
  ],
  NT:[
    {n:"Matthew",a:"Mat",c:28},{n:"Mark",a:"Mrk",c:16},{n:"Luke",a:"Luk",c:24},
    {n:"John",a:"Jhn",c:21},{n:"Acts",a:"Act",c:28},{n:"Romans",a:"Rom",c:16},
    {n:"1 Corinthians",a:"1Co",c:16},{n:"2 Corinthians",a:"2Co",c:13},{n:"Galatians",a:"Gal",c:6},
    {n:"Ephesians",a:"Eph",c:6},{n:"Philippians",a:"Php",c:4},{n:"Colossians",a:"Col",c:4},
    {n:"1 Thessalonians",a:"1Th",c:5},{n:"2 Thessalonians",a:"2Th",c:3},{n:"1 Timothy",a:"1Ti",c:6},
    {n:"2 Timothy",a:"2Ti",c:4},{n:"Titus",a:"Tit",c:3},{n:"Philemon",a:"Phm",c:1},
    {n:"Hebrews",a:"Heb",c:13},{n:"James",a:"Jam",c:5},{n:"1 Peter",a:"1Pe",c:5},
    {n:"2 Peter",a:"2Pe",c:3},{n:"1 John",a:"1Jn",c:5},{n:"2 John",a:"2Jn",c:1},
    {n:"3 John",a:"3Jn",c:1},{n:"Jude",a:"Jud",c:1},{n:"Revelation",a:"Rev",c:22}
  ]
};
const ALL=[...BOOKS.OT,...BOOKS.NT];

const VOTD=[
  {r:"John 3:16",t:"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."},
  {r:"Psalm 23:1",t:"The Lord is my shepherd; I shall not want."},
  {r:"Proverbs 3:5",t:"Trust in the Lord with all thine heart; and lean not unto thine own understanding."},
  {r:"Philippians 4:13",t:"I can do all things through Christ which strengtheneth me."},
  {r:"Romans 8:28",t:"And we know that all things work together for good to them that love God."},
  {r:"Isaiah 40:31",t:"But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles."},
  {r:"Matthew 5:16",t:"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."},
];

const PLAN=[
  {d:1,ref:"Genesis 1–2"},{d:2,ref:"Genesis 3–5"},{d:3,ref:"Genesis 6–9"},
  {d:4,ref:"Genesis 12–15"},{d:5,ref:"Exodus 1–4"},{d:6,ref:"Exodus 14–16"},
  {d:7,ref:"Psalm 1, 8, 23"},{d:8,ref:"Psalm 91, 103"},{d:9,ref:"Proverbs 1–4"},
  {d:10,ref:"Isaiah 40–41"},{d:11,ref:"Isaiah 53–55"},{d:12,ref:"Jeremiah 1–3"},
  {d:13,ref:"Daniel 1–3"},{d:14,ref:"Matthew 1–4"},{d:15,ref:"Matthew 5–7"},
  {d:16,ref:"Matthew 14–17"},{d:17,ref:"Matthew 26–28"},{d:18,ref:"Mark 1–4"},
  {d:19,ref:"Luke 1–3"},{d:20,ref:"Luke 15–16"},{d:21,ref:"John 1–3"},
  {d:22,ref:"John 10–11"},{d:23,ref:"John 14–17"},{d:24,ref:"Acts 1–3"},
  {d:25,ref:"Acts 9–10"},{d:26,ref:"Romans 3–5"},{d:27,ref:"Romans 8–9"},
  {d:28,ref:"1 Corinthians 13–15"},{d:29,ref:"Ephesians 1–3"},{d:30,ref:"Revelation 21–22"},
];

let S={testament:'OT',book:'Genesis',chapter:1,trans:'kjv',fs:16,hlColor:'hl-y',highlights:{},bookmarks:{},notes:{},planDone:{},verses:[]};

try{const sv=localStorage.getItem('bibleV2');if(sv){const p=JSON.parse(sv);S.highlights=p.highlights||{};S.bookmarks=p.bookmarks||{};S.notes=p.notes||{};S.planDone=p.planDone||{};}}catch(e){}

function save(){try{localStorage.setItem('bibleV2',JSON.stringify({highlights:S.highlights,bookmarks:S.bookmarks,notes:S.notes,planDone:S.planDone}));}catch(e){}}
function getBook(n){return ALL.find(b=>b.n===n)||ALL[0]}
function vkey(b,c,v){return`${b}|${c}|${v}`}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);}
function setFS(n){S.fs=Math.max(13,Math.min(22,n));document.getElementById('fs-label').textContent='Aa '+S.fs+'px';document.documentElement.style.setProperty('--fs',S.fs+'px');}

async function fetchChapter(book,chapter,trans){
  try{
    const r=await fetch(`https://bible-api.com/${getBook(book).a}+${chapter}?translation=${trans}`);
    const d=await r.json();
    if(d.verses&&d.verses.length)return d.verses.map(v=>({n:v.verse,t:v.text.trim()}));
  }catch(e){}
  return[];
}

function renderBooks(){
  const ul=document.getElementById('bk-list');
  ul.innerHTML=BOOKS[S.testament].map(b=>`<div class="bk${b.n===S.book?' on':''}" data-b="${b.n}"><span>${b.n}</span><span class="bk-ch">${b.c}ch</span></div>`).join('');
  ul.querySelectorAll('.bk').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.b===S.book)return;S.book=el.dataset.b;S.chapter=1;loadChapter();renderBooks();}));
}

function renderChapSel(){
  const sel=document.getElementById('tb-chap');
  const bk=getBook(S.book);
  sel.innerHTML=Array.from({length:bk.c},(_,i)=>`<option${i+1===S.chapter?' selected':''}>Chapter ${i+1}</option>`).join('');
  sel.onchange=()=>{S.chapter=parseInt(sel.value.split(' ')[1]);loadChapter();}
}

function renderProgress(){
  const idx=ALL.findIndex(b=>b.n===S.book);
  const total=ALL.reduce((s,b)=>s+b.c,0);
  const done=ALL.slice(0,idx).reduce((s,b)=>s+b.c,0)+(S.chapter-1);
  document.getElementById('progress-fill').style.width=Math.round(done/total*100)+'%';
}

function renderVerses(){
  document.getElementById('ch-title').textContent=`${S.book} ${S.chapter}`;
  document.getElementById('ch-sub').textContent=document.getElementById('tb-trans').selectedOptions[0].text;
  document.getElementById('tb-title').textContent=`${S.book} ${S.chapter}`;
  renderProgress();
  const vv=document.getElementById('vv');
  if(!S.verses.length){vv.innerHTML='<p style="color:var(--ink4);font-style:italic;text-align:center;padding:40px 0">Loading scripture…</p>';return;}
  vv.innerHTML=S.verses.map(v=>{
    const k=vkey(S.book,S.chapter,v.n);
    return`<div class="v-row${S.highlights[k]?' '+S.highlights[k]:''} ${S.bookmarks[k]?'bm':''}" data-k="${k}" data-vn="${v.n}">
      <span class="v-num">${v.n}</span>
      <span class="v-txt">${v.t}</span>
      <div class="v-acts">
        <button class="va" title="Highlight" onclick="applyHL('${k}')">🖊</button>
        <button class="va" title="Bookmark" onclick="toggleBM('${k}','${v.n}')">🔖</button>
        <button class="va" title="Copy" onclick="copyV('${k}','${v.n}')">📋</button>
        <button class="va" title="Note" onclick="addNoteFor('${v.n}')">📝</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('reader').scrollTop=0;
  document.getElementById('bn-prev').disabled=S.chapter<=1&&ALL.findIndex(b=>b.n===S.book)===0;
  document.getElementById('bn-next').disabled=S.chapter>=getBook(S.book).c&&ALL.findIndex(b=>b.n===S.book)===ALL.length-1;
}

window.applyHL=function(k){if(S.hlColor==='clear')delete S.highlights[k];else S.highlights[k]=S.hlColor;save();renderVerses();};
window.toggleBM=function(k,vn){
  if(S.bookmarks[k]){delete S.bookmarks[k];toast('Bookmark removed');}
  else{const v=S.verses.find(x=>x.n==vn);S.bookmarks[k]={book:S.book,chapter:S.chapter,verse:vn,text:v?v.t:''};toast('Bookmarked!');}
  save();renderVerses();renderBM();
};
window.copyV=function(k,vn){
  const v=S.verses.find(x=>x.n==vn);
  if(v)navigator.clipboard.writeText(`"${v.t}" — ${S.book} ${S.chapter}:${vn} (${S.trans.toUpperCase()})`).then(()=>toast('Copied!')).catch(()=>toast('Copy failed'));
};
window.addNoteFor=function(vn){
  openPanel('pn-notes');
  document.getElementById('notes-ctx').textContent=`Note for ${S.book} ${S.chapter}:${vn}`;
  document.getElementById('notes-ta').dataset.ref=`${S.book}|${S.chapter}`;
  document.getElementById('notes-ta').focus();
};

async function loadChapter(){
  renderChapSel();
  document.getElementById('vv').innerHTML='<p style="color:var(--ink4);font-style:italic;text-align:center;padding:40px 0">Loading scripture…</p>';
  S.verses=await fetchChapter(S.book,S.chapter,S.trans);
  renderVerses();loadNoteForChap();
}

function loadNoteForChap(){
  const k=`${S.book}|${S.chapter}`;
  const ta=document.getElementById('notes-ta');
  ta.value=S.notes[k]||'';ta.dataset.ref=k;
  document.getElementById('notes-ctx').textContent=`Note for ${S.book} ${S.chapter}`;
  renderNotesList();
}

function renderBM(){
  const body=document.getElementById('bm-body');
  const bms=Object.entries(S.bookmarks);
  if(!bms.length){body.innerHTML='<p style="font-size:12px;color:var(--ink4);font-style:italic;text-align:center;padding:20px">No bookmarks yet.<br>Click 🔖 on any verse.</p>';return;}
  body.innerHTML=bms.map(([k,bm])=>`
    <div class="bm-card" onclick="goBM('${bm.book}',${bm.chapter},${bm.verse})">
      <div class="bm-ref">${bm.book} ${bm.chapter}:${bm.verse}
        <button class="bm-del" onclick="event.stopPropagation();delBM('${k}')"><i class="ti ti-x" style="font-size:11px"></i></button>
      </div>
      <div class="bm-preview">${bm.text.substring(0,80)}…</div>
    </div>`).join('');
}

window.goBM=function(book,chapter,verse){
  S.book=book;S.chapter=parseInt(chapter);
  S.testament=BOOKS.OT.find(b=>b.n===book)?'OT':'NT';
  document.querySelectorAll('.tb').forEach(t=>t.classList.toggle('on',t.dataset.t===S.testament));
  closeAllPanels();loadChapter();renderBooks();
  setTimeout(()=>{const r=document.querySelector(`.v-row[data-vn="${verse}"]`);if(r)r.scrollIntoView({behavior:'smooth',block:'center'});},400);
};
window.delBM=function(k){delete S.bookmarks[k];save();renderBM();renderVerses();};

function renderPlan(){
  document.getElementById('plan-body').innerHTML=PLAN.map(p=>`
    <div class="plan-day${S.planDone[p.d]?' done':''}" onclick="togglePlanDay(${p.d})">
      <div class="day-check">${S.planDone[p.d]?'✓':''}</div>
      <div><div class="day-label">Day ${p.d}</div><div class="day-ref">${p.ref}</div></div>
    </div>`).join('');
}
window.togglePlanDay=function(d){if(S.planDone[d])delete S.planDone[d];else S.planDone[d]=true;save();renderPlan();};

function renderNotesList(){
  const ul=document.getElementById('notes-list');
  const entries=Object.entries(S.notes).filter(([,v])=>v.trim());
  if(!entries.length){ul.innerHTML='<p style="font-size:12px;color:var(--ink4);font-style:italic">No notes yet.</p>';return;}
  ul.innerHTML=entries.map(([k,txt])=>`<div class="note-entry"><div class="note-ref">${k.replace('|',' — Ch. ')}</div><div class="note-txt">${txt.substring(0,100)}${txt.length>100?'…':''}</div></div>`).join('');
}

document.getElementById('save-note').addEventListener('click',()=>{
  const ta=document.getElementById('notes-ta');
  const k=ta.dataset.ref||`${S.book}|${S.chapter}`;
  if(ta.value.trim())S.notes[k]=ta.value.trim();else delete S.notes[k];
  save();toast('Note saved');renderNotesList();
});

function openPanel(id){
  closeAllPanels();
  document.getElementById(id).classList.add('open');
  if(id==='pn-bm')renderBM();
  if(id==='pn-plan')renderPlan();
  if(id==='pn-notes')loadNoteForChap();
}
function closeAllPanels(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
  ['btn-bm-panel','btn-plan','btn-notes'].forEach(id=>document.getElementById(id).classList.remove('on'));
}
document.querySelectorAll('.pn-close').forEach(btn=>btn.addEventListener('click',()=>document.getElementById(btn.dataset.close).classList.remove('open')));

document.getElementById('btn-bm-panel').addEventListener('click',function(){const o=document.getElementById('pn-bm').classList.contains('open');closeAllPanels();if(!o){openPanel('pn-bm');this.classList.add('on');}});
document.getElementById('btn-plan').addEventListener('click',function(){const o=document.getElementById('pn-plan').classList.contains('open');closeAllPanels();if(!o){openPanel('pn-plan');this.classList.add('on');}});
document.getElementById('btn-notes').addEventListener('click',function(){const o=document.getElementById('pn-notes').classList.contains('open');closeAllPanels();if(!o){openPanel('pn-notes');this.classList.add('on');}});

document.querySelectorAll('.tb').forEach(btn=>btn.addEventListener('click',()=>{S.testament=btn.dataset.t;document.querySelectorAll('.tb').forEach(t=>t.classList.toggle('on',t.dataset.t===S.testament));renderBooks();}));
document.getElementById('tb-trans').addEventListener('change',e=>{S.trans=e.target.value;loadChapter();});

document.getElementById('bn-prev').addEventListener('click',()=>{
  if(S.chapter>1){S.chapter--;loadChapter();return;}
  const idx=ALL.findIndex(b=>b.n===S.book);
  if(idx>0){const p=ALL[idx-1];S.book=p.n;S.chapter=p.c;S.testament=BOOKS.OT.find(b=>b.n===p.n)?'OT':'NT';document.querySelectorAll('.tb').forEach(t=>t.classList.toggle('on',t.dataset.t===S.testament));renderBooks();loadChapter();}
});
document.getElementById('bn-next').addEventListener('click',()=>{
  const bk=getBook(S.book);
  if(S.chapter<bk.c){S.chapter++;loadChapter();return;}
  const idx=ALL.findIndex(b=>b.n===S.book);
  if(idx<ALL.length-1){const nx=ALL[idx+1];S.book=nx.n;S.chapter=1;S.testament=BOOKS.OT.find(b=>b.n===nx.n)?'OT':'NT';document.querySelectorAll('.tb').forEach(t=>t.classList.toggle('on',t.dataset.t===S.testament));renderBooks();loadChapter();}
});

document.querySelectorAll('.hl-dot').forEach(d=>d.addEventListener('click',()=>{document.querySelectorAll('.hl-dot').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');S.hlColor=d.dataset.c;}));
setFS(16);
document.getElementById('fs-up').addEventListener('click',()=>setFS(S.fs+1));
document.getElementById('fs-dn').addEventListener('click',()=>setFS(S.fs-1));
document.getElementById('btn-share').addEventListener('click',()=>{navigator.clipboard.writeText(`${S.book} ${S.chapter} (${S.trans.toUpperCase()})`).then(()=>toast('Reference copied!')).catch(()=>toast('Copied!'));});

let sqt;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(sqt);const q=e.target.value.trim();
  if(!q){document.getElementById('sr-panel').classList.remove('vis');return;}
  sqt=setTimeout(()=>doSearch(q),380);
});

async function doSearch(q){
  if(q.length<3)return;
  const panel=document.getElementById('sr-panel');const inner=document.getElementById('sr-inner');
  panel.classList.add('vis');inner.innerHTML='<p style="color:var(--ink4);font-style:italic;font-size:12px">Searching…</p>';
  try{
    const trans=['clementine','almeida','rccv'].includes(S.trans)?'kjv':S.trans;
    const r=await fetch(`https://bible-api.com/${encodeURIComponent(q)}?translation=${trans}`);
    const d=await r.json();
    if(d.verses&&d.verses.length){
      const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      inner.innerHTML=`<div class="sr-hd">${d.verses.length} result${d.verses.length>1?'s':''} for "${q}"</div>`+
        d.verses.map(v=>`<div class="sr-row" onclick="goRef('${v.book_name}',${v.chapter},${v.verse})"><div class="sr-ref">${v.book_name} ${v.chapter}:${v.verse}</div><div class="sr-txt">${v.text.replace(re,m=>`<em>${m}</em>`).substring(0,130)}</div></div>`).join('');
    }else{inner.innerHTML='<p style="color:var(--ink4);font-style:italic;font-size:12px;padding:6px 0">No results. Try a keyword or reference like "John 3:16".</p>';}
  }catch(e){inner.innerHTML='<p style="color:var(--ink4);font-style:italic;font-size:12px;padding:6px 0">Search unavailable. Check your internet connection.</p>';}
}

window.goRef=function(book,chapter,verse){
  S.book=book;S.chapter=parseInt(chapter);
  S.testament=BOOKS.OT.find(b=>b.n===book)?'OT':'NT';
  document.querySelectorAll('.tb').forEach(t=>t.classList.toggle('on',t.dataset.t===S.testament));
  document.getElementById('sr-panel').classList.remove('vis');
  document.getElementById('q').value='';
  loadChapter().then(()=>setTimeout(()=>{const row=document.querySelector(`.v-row[data-vn="${verse}"]`);if(row)row.scrollIntoView({behavior:'smooth',block:'center'});},350));
  renderBooks();
};

document.getElementById('menu-btn').addEventListener('click',()=>{document.getElementById('sb').classList.toggle('open');document.getElementById('sb-overlay').classList.toggle('vis');});
document.getElementById('sb-overlay').addEventListener('click',()=>{document.getElementById('sb').classList.remove('open');document.getElementById('sb-overlay').classList.remove('vis');});

const v=VOTD[new Date().getDate()%VOTD.length];
document.getElementById('votd-ref').textContent=v.r;
document.getElementById('votd-text').textContent=v.t;

renderBooks();
loadChapter();
</script>
</body>
</html>
